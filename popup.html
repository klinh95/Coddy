<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coddy Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Coddy Helper</h1>
    <p class="intro">Giải câu hỏi đang mở, điền đáp án và tùy chọn nộp tự động.</p>

    <label for="apiKey">OpenAI API key</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…">

    <label for="model">Model</label>
    <input id="model" type="text" value="gpt-6-astra" spellcheck="false">

    <label class="check">
      <input id="autoSubmit" type="checkbox" checked>
      <span>Tự nộp sau khi điền</span>
    </label>

    <button id="solve">Giải bài trên tab Coddy</button>
    <div id="status" role="status"></div>
    <pre id="result" hidden></pre>

    <p class="privacy">Khi bấm giải, tiện ích gửi nội dung bài tập và code trong editor tới OpenAI API. API key được lưu cục bộ trong Chrome. Hãy kiểm tra lời giải trước khi nộp nếu muốn.</p>
    <button id="save" class="secondary">Lưu cài đặt</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
